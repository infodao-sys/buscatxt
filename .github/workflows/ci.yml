# Integracion continua: compila y prueba buscatxt en Linux y en Windows en
# cada cambio, y prueba los scripts de instalacion de ambos sistemas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      firmar:
        description: 'Firmar el .exe con SignPath (hay que aprobar la firma en SignPath)'
        type: boolean
        default: false

# Solo lectura: el flujo no publica ni modifica nada.
permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable
        run: rustup update stable && rustup default stable && rustup component add clippy
      - name: Compilar
        run: cargo build --release --locked
      - name: Revisar el codigo (clippy)
        run: cargo clippy --release --locked
      - name: Pruebas
        shell: bash
        run: ./scripts/ci-pruebas.sh

  instalador-linux:
    name: Instalador de Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar
        run: ./scripts/instalar-linux.sh
      - name: Usar el comando desde una terminal nueva
        run: bash -ic 'buscatxt -V && buscatxt AGUJA tests/fixtures -d'
      - name: Desinstalar
        run: |
          ./scripts/instalar-linux.sh --desinstalar
          test ! -e ~/.local/bin/buscatxt
          ! grep -q 'agregado por buscatxt' ~/.bashrc

  instalador-windows:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\instalar-windows.ps1
      - name: Usar el comando desde una terminal nueva
        shell: pwsh
        run: |
          # Una terminal nueva toma el PATH del usuario guardado en el registro.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          buscatxt -V
          buscatxt AGUJA tests\fixtures -d
          if ($LASTEXITCODE -ne 0) { throw "buscatxt no encontro el texto" }
      - name: Usar el comando desde cmd
        shell: cmd
        run: |
          for /f "skip=2 tokens=2,*" %%A in ('reg query HKCU\Environment /v Path') do set "PATH=%PATH%;%%B"
          buscatxt "AGUJA" tests\fixtures -d -l
      - name: Desinstalar
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\instalar-windows.ps1 -Desinstalar
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\buscatxt'
          if (Test-Path $dest) { throw "la carpeta sigue existiendo" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -like "*$dest*") { throw "la carpeta sigue en el PATH" }
          'Desinstalacion correcta'

  ejecutable-windows:
    name: Ejecutable de Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable
        run: rustup update stable && rustup default stable
      - name: Compilar con MSVC
        run: cargo build --release --locked
      - name: Probar el ejecutable
        shell: bash
        run: ./scripts/ci-pruebas.sh target/release/buscatxt.exe
      - name: Comprobar que no necesita el runtime de Visual C++
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('target\release\buscatxt.exe'))
          if ($text -match '(?i)vcruntime|msvcp\d|ucrtbase\.dll|api-ms-win-crt') { throw 'el ejecutable depende del runtime de Visual C++' }
          'Sin dependencias del runtime de Visual C++'
      - name: Comprobar el icono y la informacion de version
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'target\release\buscatxt.exe').Path
          $info = (Get-Item $exe).VersionInfo
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($info.ProductVersion -ne $version) { throw "version '$($info.ProductVersion)', se esperaba '$version'" }
          if ($info.ProductName -ne 'buscatxt') { throw 'falta el nombre del producto en la informacion de version' }
          # El borde izquierdo del icono es el fondo azul; el icono generico de Windows no lo tiene.
          Add-Type -AssemblyName System.Drawing
          $pixel = [Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().GetPixel(3, 16)
          if (-not ($pixel.B -gt 150 -and $pixel.R -lt 80)) { throw "el ejecutable no tiene el icono de buscatxt (pixel $pixel)" }
          "Icono y version $version incluidos"
      - name: Guardar el ejecutable
        id: subir-exe
        uses: actions/upload-artifact@v4
        with:
          name: buscatxt-windows-x86_64
          path: target/release/buscatxt.exe
          if-no-files-found: error

      # Firma digital con SignPath (certificado de SignPath Foundation). Solo
      # se ejecuta al lanzar el flujo a mano con "firmar"; cada firma se
      # aprueba en SignPath. Ver CODE_SIGNING_POLICY.md.
      - name: Firmar con SignPath
        if: ${{ inputs.firmar }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'buscatxt' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.subir-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: firmado
      - name: Comprobar la firma
        if: ${{ inputs.firmar }}
        shell: pwsh
        run: |
          $firma = Get-AuthenticodeSignature 'firmado\buscatxt.exe'
          if ($firma.Status -ne 'Valid') { throw "firma no valida: $($firma.Status) $($firma.StatusMessage)" }
          $info = (Get-Item 'firmado\buscatxt.exe').VersionInfo
          if ($info.ProductName -ne 'buscatxt') { throw 'el ejecutable firmado no es buscatxt' }
          "Firmado por: $($firma.SignerCertificate.Subject)"
      - name: Probar el ejecutable firmado
        if: ${{ inputs.firmar }}
        shell: bash
        run: ./scripts/ci-pruebas.sh firmado/buscatxt.exe
      - name: Guardar el ejecutable firmado
        if: ${{ inputs.firmar }}
        uses: actions/upload-artifact@v4
        with:
          name: buscatxt-windows-x86_64-firmado
          path: firmado/buscatxt.exe
          if-no-files-found: error
